}
function svgPoint(evt) {
  const rect = svg.getBoundingClientRect();
  return { x: (evt.clientX - rect.left - view.x) / view.k, y: (evt.clientY - rect.top - view.y) / view.k };
}

svg.addEventListener("wheel", evt => {
  evt.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = evt.clientX - rect.left, my = evt.clientY - rect.top;
  const k2 = Math.min(4, Math.max(0.15, view.k * (evt.deltaY < 0 ? 1.15 : 0.87)));
  view.x = mx - (mx - view.x) * (k2 / view.k);
  view.y = my - (my - view.y) * (k2 / view.k);
  view.k = k2;
  applyView();
}, { passive: false });

let drag = null;
let onTap = null;  // 当前视图注册的点按回调
svg.addEventListener("pointerdown", evt => {
  const pt = svgPoint(evt);
  const hit = currentHitTest ? currentHitTest(pt) : null;
  drag = hit ? { target: hit, moved: false } : { pan: true, sx: evt.clientX, sy: evt.clientY, ox: view.x, oy: view.y };
  svg.setPointerCapture(evt.pointerId);
});
svg.addEventListener("pointermove", evt => {
  const pt = svgPoint(evt);
  if (drag && drag.target && drag.target.draggable) {
    drag.target.x = pt.x; drag.target.y = pt.y; drag.target.pinned = true; drag.moved = true;
    if (currentOnDrag) currentOnDrag();
  } else if (drag && drag.pan) {
    view.x = drag.ox + evt.clientX - drag.sx;
    view.y = drag.oy + evt.clientY - drag.sy;
    applyView();
  } else if (currentHitTest && currentTooltip) {
    const hit = currentHitTest(pt);
    if (hit) {
      const t = currentTooltip(hit);
      tooltip.style.display = "block";
      tooltip.style.left = (evt.clientX - wrap.getBoundingClientRect().left + 14) + "px";
      tooltip.style.top = (evt.clientY - wrap.getBoundingClientRect().top + 10) + "px";
      tooltip.innerHTML = t;
    } else tooltip.style.display = "none";
  }
});
svg.addEventListener("pointerup", () => {
  if (drag && drag.target && !drag.moved && onTap) onTap(drag.target);
  else if (drag && drag.pan && onTap) onTap(null);
  drag = null;
});
svg.addEventListener("pointerleave", () => { tooltip.style.display = "none"; });

let currentHitTest = null, currentTooltip = null, currentOnDrag = null;

// ---------- 视图 1：功能模块图 ----------
function renderDomains() {
  const groups = DATA.domains.groups;
  const cols = Math.ceil(Math.sqrt(groups.length));
  const colW = 330, padX = 60, padTop = 50, gapY = 46;
  const colRows = [];
  groups.forEach(g => { g.h = 56 + g.members.length * 20 + 10; });
  // 按列分配，列内累加高度
  const colHeights = new Array(cols).fill(padTop);
  groups.forEach((g, i) => {
    let col = 0;
    for (let c = 1; c < cols; c++) if (colHeights[c] < colHeights[col]) col = c;
    g.x = padX + col * colW;
    g.y = colHeights[col];
    colHeights[col] += g.h + gapY;
  });
  const byId = {};
  groups.forEach(g => byId[g.id] = g);

  const edgeEls = (DATA.domains.edges || []).map(e => {
    const s = byId[e.from], t = byId[e.to];
    if (!s || !t) return null;
    const g = el("g", {}, viewport);
    const line = el("path", { class: "edge", "stroke-width": 1.6, "marker-end": "url(#arrow)" }, g);
    const label = textEl(g, { class: "edge-label" }, e.label || "");
    return { s, t, line, label };
  }).filter(Boolean);

  const groupEls = groups.map(g => {
    const gg = el("g", { class: "group" }, viewport);
    el("rect", { width: 250, height: g.h }, gg);
    textEl(gg, { class: "g-label", x: 14, y: 24 }, g.label);
    textEl(gg, { class: "g-summary", x: 14, y: 41 }, g.summary || "");
    g.members.forEach((m, i) => textEl(gg, { class: "g-member", x: 14, y: 62 + i * 20 }, "· " + m));
    gg.setAttribute("transform", `translate(${g.x},${g.y})`);
    return gg;
  });

  function drawEdges() {
    edgeEls.forEach(({ s, t, line, label }) => {
      const sx = s.x + 125, sy = s.y + s.h / 2, tx = t.x + 125, ty = t.y + t.h / 2;
      const mx = (sx + tx) / 2;
      line.setAttribute("d", `M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}`);
      label.setAttribute("x", mx);
      label.setAttribute("y", (sy + ty) / 2 - 6);
    });
  }
  drawEdges();
  fitTo(groups.map(g => g.x + 125), groups.map(g => g.y + g.h / 2), 170);

  let focused = null;
  function applyFocus() {
    groupEls.forEach((gg, i) => gg.classList.toggle("hl", groups[i].id === focused));
    edgeEls.forEach(({ s, t, line, label }) => {
      const on = focused && (s.id === focused || t.id === focused);
      line.classList.toggle("hl", !!on);
      line.classList.toggle("dim", !!(focused && !on));
      label.classList.toggle("dim", !!(focused && !on));
    });
  }
  currentHitTest = pt => groups.find(g => pt.x >= g.x && pt.x <= g.x + 250 && pt.y >= g.y && pt.y <= g.y + g.h);
  currentTooltip = g => `<div class="t-id">${g.label}</div>` +
    (g.summary ? `<div class="t-summary">${g.summary}</div>` : "") +
    `<div class="t-meta" style="margin-top:4px">${g.members.join("、")}</div>`;
  currentOnDrag = null;
  onTap = g => { focused = g && focused !== g.id ? g.id : null; applyFocus(); };
  hint.textContent = "功能域一览：点击分组高亮与其他域的交互 · 滚轮缩放 · 拖拽平移";
}

// ---------- 视图 2：模块依赖图（力导向）----------
let depsState = null;
function renderDeps() {
  if (!depsState) {
    const nodes = DATA.deps.nodes.map((n, i) => ({
      ...n,
      x: W() / 2 + Math.cos(i * 2.399) * (80 + i * 4),
      y: H() / 2 + Math.sin(i * 2.399) * (80 + i * 4),
      vx: 0, vy: 0,
      r: 9 + Math.min(18, Math.sqrt(n.files) * 3.2)
    }));
    const byId = {};
    nodes.forEach(n => byId[n.id] = n);
    const edges = DATA.deps.edges.map(e => ({ ...e, s: byId[e.from], t: byId[e.to] }))
      .filter(e => e.s && e.t && e.s !== e.t);
    depsState = { nodes, edges, laid: false };
  }
  const { nodes, edges } = depsState;
  const cx = () => W() / 2, cy = () => H() / 2;
  function tick() {
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy || 0.01;
        if (d2 > 240000) continue;
        const d = Math.sqrt(d2);
        const f = Math.min(6, 2600 / d2);
        dx = dx / d * f; dy = dy / d * f;
        a.vx += dx; a.vy += dy; b.vx -= dx; b.vy -= dy;
      }
      a.vx += (cx() - a.x) * 0.012;
      a.vy += (cy() - a.y) * 0.012;
    }
    for (const e of edges) {
      const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const f = (d - 130) * 0.02;
      const fx = dx / d * f, fy = dy / d * f;
      e.s.vx += fx; e.s.vy += fy; e.t.vx -= fx; e.t.vy -= fy;
    }
    for (const n of nodes) {
      if (n.pinned) { n.vx = 0; n.vy = 0; continue; }
      n.x += n.vx *= 0.82;
      n.y += n.vy *= 0.82;
    }
  }
  if (!depsState.laid) { for (let i = 0; i < 280; i++) tick(); depsState.laid = true; }

  const edgeEls = edges.map(e => el("line", {
    class: "edge", "stroke-width": 0.6 + Math.min(3.5, Math.log2(e.weight + 1)), "marker-end": "url(#arrow)"
  }, viewport));
  const nodeEls = nodes.map(n => {
    const g = el("g", { class: "node" }, viewport);
    el("circle", { r: n.r, fill: nodeColor(n) }, g);
    textEl(g, { y: n.r + 13 }, n.id);
    return g;
  });
  function render() {
    edges.forEach((e, i) => {
      const d = Math.hypot(e.t.x - e.s.x, e.t.y - e.s.y) || 1;
      edgeEls[i].setAttribute("x1", e.s.x + (e.t.x - e.s.x) / d * (e.s.r + 2));
      edgeEls[i].setAttribute("y1", e.s.y + (e.t.y - e.s.y) / d * (e.s.r + 2));
      edgeEls[i].setAttribute("x2", e.t.x - (e.t.x - e.s.x) / d * (e.t.r + 8));
      edgeEls[i].setAttribute("y2", e.t.y - (e.t.y - e.s.y) / d * (e.t.r + 8));
    });
    nodes.forEach((n, i) => nodeEls[i].setAttribute("transform", `translate(${n.x},${n.y})`));
  }
  render();
  if (!depsState.fitted) {
    fitTo(nodes.map(n => n.x), nodes.map(n => n.y), 60);
    depsState.fitted = true;
  } else applyView();

  const neighbors = {};
  nodes.forEach(n => neighbors[n.id] = new Set([n.id]));
  edges.forEach(e => { neighbors[e.from].add(e.to); neighbors[e.to].add(e.from); });
  let focused = null;
  function applyFocus() {
    nodes.forEach((n, i) => nodeEls[i].classList.toggle("dim", !!(focused && !neighbors[focused].has(n.id))));
    edges.forEach((e, i) => {
      const on = focused && (e.from === focused || e.to === focused);
      edgeEls[i].classList.toggle("hl", !!on);
      edgeEls[i].classList.toggle("dim", !!(focused && !on));
    });
    document.querySelectorAll(".mod-item").forEach(item =>
      item.classList.toggle("active", item.dataset.id === focused));
  }
  nodes.forEach(n => n.draggable = true);
  currentHitTest = pt => nodes.find(n => Math.hypot(n.x - pt.x, n.y - pt.y) < n.r + 4);
  currentTooltip = n => `<div class="t-id">${n.id}</div>` +
    `<div class="t-meta">${n.path} · ${n.files} 个文件 · ${n.lang}</div>` +
    (n.summary ? `<div class="t-summary">${n.summary}</div>` : "");
  currentOnDrag = () => { for (let i = 0; i < 4; i++) tick(); render(); };
  onTap = n => { focused = n && focused !== n.id ? n.id : null; applyFocus(); };
  hint.textContent = "代码依赖视角（静态 import 分析）：拖拽节点 · 点击高亮上下游 · 滚轮缩放";

  // 侧边栏：模块职责
  document.getElementById("sidebar-title").textContent = "模块职责";
  const list = document.getElementById("mod-list");
  list.innerHTML = "";
  nodes.slice().sort((a, b) => b.files - a.files).forEach(n => {
    const div = document.createElement("div");
    div.className = "mod-item";
    div.dataset.id = n.id;
    div.innerHTML = `<div class="m-name"><span class="m-dot" style="background:${nodeColor(n)}"></span>${n.id}</div>` +
      (n.summary ? `<div class="m-summary">${n.summary}</div>` : "");
    div.onclick = () => { focused = focused !== n.id ? n.id : null; applyFocus(); };
    list.appendChild(div);
  });
}

// ---------- 视图 3：数据流链路图（分层布局）----------
function renderFlow(flow) {
  const nodes = flow.nodes.map(n => ({ ...n }));
  const byId = {};
  nodes.forEach(n => byId[n.id] = n);
  const edges = flow.edges.filter(e => byId[e.from] && byId[e.to]);

  // 最长路径分层
  const layer = {}, indeg = {}, adj = {};
  nodes.forEach(n => { layer[n.id] = 0; indeg[n.id] = 0; });
  edges.forEach(e => { indeg[e.to]++; (adj[e.from] = adj[e.from] || []).push(e.to); });
  const deg = { ...indeg };
  const queue = nodes.filter(n => !indeg[n.id]).map(n => n.id);
  while (queue.length) {
    const u = queue.shift();
    for (const v of adj[u] || []) {
      layer[v] = Math.max(layer[v], layer[u] + 1);
      if (--deg[v] === 0) queue.push(v);
    }
  }
  const byLayer = {};
  nodes.forEach(n => (byLayer[layer[n.id]] = byLayer[layer[n.id]] || []).push(n));
  // 层内重心排序（两轮）
  const pos = {};
  for (let round = 0; round < 3; round++) {
    Object.keys(byLayer).forEach(l => {
      byLayer[l].forEach((n, i) => pos[n.id] = i);
      if (+l === 0) return;
      byLayer[l].sort((a, b) => {
        const ba = edges.filter(e => e.to === a.id).map(e => pos[e.from] ?? 0);
        const bb = edges.filter(e => e.to === b.id).map(e => pos[e.from] ?? 0);
        const av = ba.length ? ba.reduce((x, y) => x + y, 0) / ba.length : 0;
        const bv = bb.length ? bb.reduce((x, y) => x + y, 0) / bb.length : 0;
        return av - bv;
      });
    });
  }
  const NODE_W = 190, NODE_H = 54, GAP_X = 90, GAP_Y = 34;
  Object.keys(byLayer).forEach(l => {
    byLayer[l].forEach((n, i) => {
      n.x = 60 + (+l) * (NODE_W + GAP_X);
      n.y = 50 + i * (NODE_H + GAP_Y) + (+l % 2) * 14;
    });
  });

  const edgeEls = edges.map(e => {
    const s = byId[e.from], t = byId[e.to];
    const g = el("g", {}, viewport);
    const line = el("path", { class: "edge", "stroke-width": 1.6, "marker-end": "url(#arrow)" }, g);
    const label = e.label ? textEl(g, { class: "edge-label" }, e.label) : null;
    const sx = s.x + NODE_W, sy = s.y + NODE_H / 2, tx = t.x, ty = t.y + NODE_H / 2;
    const sameLane = layer[s.id] === layer[t.id];
    let d, lx, ly;
    if (sameLane) {  // 同层回边绕上方
      d = `M ${sx - NODE_W / 2} ${s.y} C ${sx - NODE_W / 2} ${s.y - 44}, ${tx + NODE_W / 2} ${t.y - 44}, ${tx + NODE_W / 2} ${t.y}`;
      lx = (sx + tx) / 2; ly = Math.min(s.y, t.y) - 38;
    } else {
      const mx = (sx + tx) / 2;
      d = `M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}`;
      lx = mx; ly = (sy + ty) / 2 - 6;
    }
    line.setAttribute("d", d);
    if (label) { label.setAttribute("x", lx); label.setAttribute("y", ly); }
    return { s, t, line, label };
  });

  const nodeEls = nodes.map(n => {
    const g = el("g", { class: "flow-node" }, viewport);
    el("rect", { width: NODE_W, height: NODE_H }, g);
    textEl(g, { x: NODE_W / 2, y: n.code ? 24 : 32 }, n.label);
    if (n.code) textEl(g, { class: "code", x: NODE_W / 2, y: 41 }, n.code);
    g.setAttribute("transform", `translate(${n.x},${n.y})`);
    return g;
  });
  fitTo(nodes.map(n => n.x + NODE_W / 2), nodes.map(n => n.y + NODE_H / 2), 90);

  let focused = null;
  function applyFocus() {
    nodeEls.forEach((g, i) => {
      g.classList.toggle("hl", nodes[i].id === focused);
      g.classList.toggle("dim", !!(focused && nodes[i].id !== focused &&
        !edges.some(e => (e.from === focused && e.to === nodes[i].id) || (e.to === focused && e.from === nodes[i].id))));
    });
    edgeEls.forEach(({ s, t, line, label }) => {
      const on = focused && (s.id === focused || t.id === focused);
      line.classList.toggle("hl", !!on);
      line.classList.toggle("dim", !!(focused && !on));
      if (label) label.classList.toggle("dim", !!(focused && !on));
    });
    document.querySelectorAll(".mod-item").forEach(item =>
      item.classList.toggle("active", item.dataset.id === focused));
  }
  currentHitTest = pt => nodes.find(n => pt.x >= n.x && pt.x <= n.x + NODE_W && pt.y >= n.y && pt.y <= n.y + NODE_H);
  currentTooltip = n => `<div class="t-id">${n.label}</div>` +
    (n.code ? `<div class="t-meta">${n.code}</div>` : "") +
    (n.detail ? `<div class="t-summary">${n.detail}</div>` : "");
  currentOnDrag = null;
  onTap = n => { focused = n && focused !== n.id ? n.id : null; applyFocus(); };
  hint.textContent = flow.symptom ? `排查指引：${flow.symptom}` : "数据沿箭头方向流动 · 点击环节高亮上下游";

  // 侧边栏：环节说明
  document.getElementById("sidebar-title").textContent = "环节说明";
  const list = document.getElementById("mod-list");
  list.innerHTML = "";
  nodes.forEach(n => {
    const div = document.createElement("div");
    div.className = "mod-item";
    div.dataset.id = n.id;
    div.innerHTML = `<div class="m-name">${n.label}</div>` +
      (n.code ? `<div class="m-code">${n.code}</div>` : "") +
      (n.detail ? `<div class="m-summary">${n.detail}</div>` : "");
    div.onclick = () => { focused = focused !== n.id ? n.id : null; applyFocus(); };
    list.appendChild(div);
  });
}

// ---------- 页签 ----------
const views = [{ id: "domains", label: "功能模块", render: renderDomains }];
if (DATA.deps.nodes.length) views.push({ id: "deps", label: "依赖图", render: renderDeps });
(DATA.flows || []).forEach(f => views.push({ id: "flow:" + f.id, label: "链路·" + f.title, render: () => renderFlow(f) }));
if (!DATA.domains) views.shift();

const tabsEl = document.getElementById("tabs");
views.forEach(v => {
  const btn = document.createElement("button");
  btn.textContent = v.label;
  btn.dataset.view = v.id;
  btn.onclick = () => activate(v.id);
  tabsEl.appendChild(btn);
});
function activate(id) {
  viewport.innerHTML = "";
  tooltip.style.display = "none";
  currentHitTest = currentTooltip = currentOnDrag = onTap = null;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === id));
  view = { x: 0, y: 0, k: 1 };
  applyView();
  const v = views.find(x => x.id === id);
  if (id === "domains" || id.startsWith("flow:")) {
    document.getElementById("sidebar-title").textContent = id === "domains" ? "功能域" : "环节说明";
    if (id === "domains") {
      const list = document.getElementById("mod-list");
      list.innerHTML = "";
      DATA.domains.groups.forEach(g => {
        const div = document.createElement("div");
        div.className = "mod-item";
        div.innerHTML = `<div class="m-name">${g.label}</div><div class="m-summary">${g.summary || ""}</div>`;
        list.appendChild(div);
      });
    }
  }
  v.render();
}
activate(views[0].id);
</script>
