<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SessionList 操作菜单验证</title>
    <style>
      html, body, #root { min-height:100%; margin:0; }
      body { background:var(--bg); color:var(--text); font-family:var(--display-font); }
      .fixture-shell { display:flex; min-height:100vh; gap:34px; padding:24px; box-sizing:border-box; }
      .fixture-sidebar { width:228px; height:560px; flex:0 0 228px; overflow:hidden; border:1px solid var(--border); border-radius:10px; background:var(--bg); }
      .fixture-sidebar .session-section { height:100%; min-height:0; }
      .fixture-sidebar .session-list { flex:1; min-height:0; }
      .fixture-context { max-width:620px; padding-top:18px; color:var(--text-dim); font-size:13px; }
      .fixture-context h1 { margin:0 0 12px; color:var(--text); font-size:20px; }
      .fixture-context p { line-height:1.7; }
      .fixture-context button { padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-elev); color:var(--text); cursor:pointer; }
      #selection-status, #action-log { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
      @media (max-width:700px) { .fixture-shell { gap:16px; padding:12px; } .fixture-sidebar { width:220px; flex-basis:220px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./session-list-actions-ui.tsx"></script>
  </body>
</html>
