[package]
name = "crewvela"
version = "0.1.0"
description = "CrewVela — 多Agent协作工作台"
authors = ["CrewVela"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "crewvela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：Window::add_child 子 webview（右侧栏浏览器面板）需要该 feature（Tauri 官方多 webview 路线）
# tray-icon：通用设置「关闭窗口时隐藏到托盘」需要系统托盘
tauri = { version = "2", features = ["protocol-asset", "unstable", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "=2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "=0.8.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
socket2 = "0.6"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
portable-pty = "0.8"
# ZCode OpenTUI redraws require the current screen, not concatenated history.
vt100 = "=0.18.1"
# PNG 编码：把剪贴板位图（RGBA）写成 .png 临时文件供 claude 读取
png = "0.17"
# keyring 3.x 默认不含平台后端，必须显式启用；否则会回退到内存 mock，存了也读不到
keyring = { version = "3", features = ["windows-native", "apple-native"] }
dirs = "5"
anyhow = "1"
thiserror = "1"
which = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# 自动化「每天 HH:MM」触发需要本地时区的日历换算
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 自动化 cron 高级模式：解析表达式并计算未来触发点
cron = "0.12"
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
crc32fast = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
tauri-plugin-notification = "2.0.0-rc.5"

# Linux needs a persistent Secret Service backend too; Windows/macOS keep their
# existing native backends. The synchronous backend matches secrets.rs and avoids
# blocking an async Secret Service client inside the application's Tokio runtime.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# WKWebView 的公开截图 API；仅 macOS 编译，不改变 Windows WebView2 接管。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKWebView", "WKSnapshotConfiguration"] }

[target.'cfg(windows)'.dependencies]
junction = "2"
clipboard-win = "5.4.1"
tauri-winrt-notification = "0.7.3"
windows-registry = "0.6.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    # SetThreadExecutionState：通用设置「保持电脑运行」（阻止系统空闲休眠）
    "Win32_System_Power",
    "Win32_UI_Shell",
] }
[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
